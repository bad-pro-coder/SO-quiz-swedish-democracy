    questions.forEach((q, i) => {
      const fraga = document.createElement("div")
      fraga.id = `fraga-${q.id+1}`;
      fraga.className = "fragaCard"
      fraga.innerHTML = `<h2>${q.id + 1 + ". " + q.q}</h2><textarea id="textAnswer${q.id+1}" name="story" rows="5" cols="33"></textarea><button class="submit-btn" id="btn-${q.id+1}" style="display:block; padding:5px; margin:5px;" onclick="checkAnswer(${q.id})">Rätta svar</button><p id="${"facit-" + (q.id + 1)}"></p>`
      document.getElementById("fragor").appendChild(fraga);
    });
    function checkAnswer(i){
      let minus = 0;
      document.getElementById("facit-" + (i + 1)).value
      const submit = document.getElementById("btn-" + (i + 1))
      questions[i].answered = true;
      submit.disabled = true;
      submit.style.cursor = "not-allowed";
      questions[i].keywords.forEach((keyword, ix, arr) => {
        let ifIncludes = document.getElementById("textAnswer" + (i + 1)).value.toLowerCase().includes(keyword);
        if(!ifIncludes){
          minus += 1;
        }
      });
      console.log(1 -(minus/questions[i].keywords.length))
      pts += 20 * (1 -(minus/questions[i].keywords.length))
      if(pts > 0){
        document.getElementById("facit-" + (i + 1)).innerHTML = "Rätt! + " + (20 * (1 -(minus/questions[i].keywords.length))) +  "/20 poäng! facit: " + questions[i].facit 
      }else{
        document.getElementById("facit-" + (i + 1)).innerHTML = "Inte riktigt rätt, 0 poäng, facit: " + questions[i].facit
      }
      document.getElementById("points").innerHTML = "Poäng: " + pts
